<!DOCTYPE html>
<meta charset="utf-8">
<title>Alpha Engine — venue replay (n=5000)</title>
<style>
  :root { --bg:#0b0b0e; --panel:#15151a; --line:#26262e; --tx:#d6d6dc;
          --dim:#7c7c88; --grn:#3fbf7f; --red:#e5484d; --acc:#8b7bf7; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx);
         font:13px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif; padding:14px; }
  h1 { font-size:15px; font-weight:600; margin-bottom:2px; }
  .sub { color:var(--dim); font-size:11.5px; margin-bottom:10px; }
  .wrap { display:grid; grid-template-columns: 1fr 330px; gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:10px; padding:10px 12px; }
  .ptitle { font-size:12px; color:var(--dim); margin-bottom:6px; }
  canvas { width:100%; display:block; }
  .ctrl { display:flex; gap:8px; align-items:center; margin:10px 0 4px; flex-wrap:wrap; }
  button, select { background:#1d1d24; color:var(--tx); border:1px solid var(--line);
           border-radius:7px; padding:5px 12px; font-size:12.5px; cursor:pointer; }
  button.on { background:#2a2a36; border-color:#3a3a4a; }
  input[type=range] { flex:1; accent-color:#6b6b7e; min-width:140px; }
  .tick { font-variant-numeric:tabular-nums; color:var(--dim); font-size:12px;
          min-width:190px; }
  .hdr { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap;
         font-variant-numeric:tabular-nums; margin-bottom:6px; }
  .hdr .last { font-size:20px; font-weight:600; }
  .hdr .kv { color:var(--dim); font-size:12px; }
  .hdr .kv b { color:var(--tx); font-weight:500; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums;
          font-size:12.2px; }
  th { color:var(--dim); font-weight:500; text-align:right; padding:2px 6px;
       font-size:11px; }
  th:first-child, td:first-child { text-align:left; }
  td { padding:1.5px 6px; text-align:right; position:relative; }
  td .bar { position:absolute; top:1px; bottom:1px; right:0; z-index:0; border-radius:2px; }
  td span { position:relative; z-index:1; }
  tr.spread td { border-top:1px solid var(--line); border-bottom:1px solid var(--line);
                 padding:5px 6px; color:var(--dim); }
  tr.spread td b { color:var(--tx); font-size:13px; }
  .ask td:first-child { color:var(--red); }
  .bid td:first-child { color:var(--grn); }
  #tl > div { display:flex; justify-content:space-between; gap:10px;
              padding:1px 4px; color:var(--dim);
              font-variant-numeric:tabular-nums; font-size:11.5px; }
  .up { color:var(--grn) } .dn { color:var(--red) }
</style>
<h1>Alpha Engine — live venue replay</h1>
<div class="sub" id="meta"></div>
<div class="ctrl">
  <button id="play" class="on">Pause</button>
  <span style="color:var(--dim);font-size:12px">speed</span>
  <button data-sp="1" class="sp on">1&times;</button>
  <button data-sp="5" class="sp">5&times;</button>
  <button data-sp="25" class="sp">25&times;</button>
  <span style="color:var(--dim);font-size:12px">horizon</span>
  <select id="hor">
    <option value="90">90 ticks (~1.5 h)</option>
    <option value="300" selected>300 ticks (~5 h)</option>
    <option value="720">720 ticks (~12 h)</option>
  </select>
  <input type="range" id="scrub" min="0" value="0">
  <span class="tick" id="clock"></span>
</div>
<div class="wrap">
  <div>
    <div class="panel">
      <div class="hdr" id="hdr"></div>
      <canvas id="pc" height="300"></canvas>
    </div>
    <div class="panel" style="margin-top:12px">
      <div class="ptitle">Depth — cumulative resting volume (BTC)</div>
      <canvas id="dc" height="220"></canvas></div>
  </div>
  <div class="panel">
    <div class="ptitle">Order book &nbsp;·&nbsp; price / amount (BTC) / total (BTC)</div>
    <table id="book"></table>
    <div class="trades"><div class="ptitle" style="margin-top:8px">Recent trades</div>
      <div id="tl"></div></div>
  </div>
</div>

function header() {
  const f = F[i], s = Math.max(0, i - (+$('hor').value) + 1);
  const p0 = F[s].p, d = f.p - p0, pct = 100 * d / p0;
  let vol = 0, ntr = 0;
  for (let k = s; k <= i; k++) { vol += F[k].v; ntr += F[k].x.length; }
  let hi = -1e18, lo = 1e18;
  for (let k = s; k <= i; k++) { hi = Math.max(hi, F[k].p); lo = Math.min(lo, F[k].p); }
  const sp = (f.a.length && f.b.length) ? f.a[0][0] - f.b[0][0] : NaN;
  const mid = (f.a.length && f.b.length) ? (f.a[0][0] + f.b[0][0]) / 2 : f.p;
  const cls = d >= 0 ? 'up' : 'dn', sign = d >= 0 ? '+' : '';
  $('hdr').innerHTML =
    `<span class="last ${cls}">${fmt(f.p)}</span>` +
    `<span class="${cls}">${sign}${fmt(d, 4)} (${sign}${pct.toFixed(2)}%)</span>` +
    `<span class="kv">H <b>${fmt(hi)}</b></span>` +
    `<span class="kv">L <b>${fmt(lo)}</b></span>` +
    `<span class="kv">VOL <b>${vol.toFixed(1)}</b> BTC</span>` +
    `<span class="kv">spread <b>${fmt(sp, 4)}</b> (${(1e4*sp/mid).toFixed(1)} bp)</span>`;
}

function drawPrice() {
  const cv = $('pc'), g = cv.getContext('2d');
  const W = cv.width = cv.clientWidth * 2, H = cv.height = 600;
  const hor = +$('hor').value;
  const s = Math.max(0, i - hor + 1), win = F.slice(s, i + 1);
  let lo = 1e18, hi = -1e18, vmax = 1e-12;
  for (const f of win) {
    const b = f.b.length ? f.b[0][0] : f.p, a = f.a.length ? f.a[0][0] : f.p;
    lo = Math.min(lo, b, f.p); hi = Math.max(hi, a, f.p);
    vmax = Math.max(vmax, f.v);
  }
  const pad = (hi - lo) * 0.08 + 1e-9; lo -= pad; hi += pad;
  const AXR = 110, VH = 110, PH = H - VH - 46;
  const X = k => 8 + (W - AXR - 16) * k / Math.max(win.length - 1, 1);
  const Y = p => 10 + PH * (1 - (p - lo) / (hi - lo));
  g.clearRect(0, 0, W, H);
  g.font = '19px sans-serif';
  g.strokeStyle = '#22222a'; g.fillStyle = '#7c7c88'; g.textAlign = 'left';
  for (let k = 0; k <= 4; k++) {
    const p = lo + (hi - lo) * k / 4, y = Y(p);
    g.beginPath(); g.moveTo(8, y); g.lineTo(W - AXR, y); g.stroke();
    g.fillText(fmt(p, 3), W - AXR + 8, y + 6);
  }
  g.textAlign = 'center';
  const nlab = Math.min(5, win.length);
  for (let k = 0; k < nlab; k++) {
    const j = Math.round(k * (win.length - 1) / Math.max(nlab - 1, 1));
    g.fillText(clockStr(s + j), X(j), H - 6);
  }
  // volume bars, colored by tick direction
  for (let k = 0; k < win.length; k++) {
    const f = win[k], prev = k ? win[k-1].p : f.p;
    g.fillStyle = f.p >= prev ? 'rgba(63,191,127,.5)' : 'rgba(229,72,77,.5)';
    const h = VH * f.v / vmax;
    const bw = Math.max((W - AXR - 16) / Math.max(win.length, 1) - 1, 1);
    g.fillRect(X(k) - bw/2, 10 + PH + (VH - h) + 8, bw, h);
  }
  function line(sel, col, w) {
    g.strokeStyle = col; g.lineWidth = w; g.beginPath();
    win.forEach((f, k) => {
      const v = sel(f); if (v == null) return;
      k === 0 ? g.moveTo(X(k), Y(v)) : g.lineTo(X(k), Y(v));
    });
    g.stroke();
  }
  line(f => f.a.length ? f.a[0][0] : null, 'rgba(229,72,77,.8)', 2);
  line(f => f.b.length ? f.b[0][0] : null, 'rgba(63,191,127,.8)', 2);
  line(f => f.p, '#e8e8ee', 3);
  // dotted last-price level + tag
  const f = F[i], y = Y(f.p);
  g.strokeStyle = 'rgba(139,123,247,.8)'; g.setLineDash([3, 5]); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(8, y); g.lineTo(W - AXR, y); g.stroke();
  g.setLineDash([]);
  g.fillStyle = '#8b7bf7';
  g.fillRect(W - AXR + 2, y - 15, AXR - 6, 30);
  g.fillStyle = '#0b0b0e'; g.textAlign = 'left'; g.font = '600 19px sans-serif';
  g.fillText(fmt(f.p, 3), W - AXR + 8, y + 6);
  g.lineWidth = 1;
}

function drawDepth() {
  const cv = $('dc'), g = cv.getContext('2d');
  const W = cv.width = cv.clientWidth * 2, H = cv.height = 440;
  const f = F[i];

  for (const v of f.db) cb.push(s += v);

  for (const v of f.da) ca.push(s += v);
  const ymax = Math.max(cb[PB-1], ca[PB-1]) * 1.1 + 1e-9;
  const Xk = (k, side) => W/2 + side * (k + 1) / PB * (W/2 - 12);
  const Y = v => (H - 34) * (1 - v / ymax) + 8;
  function area(cum, side, col, fill) {
    g.beginPath(); g.moveTo(W/2, Y(0));
    let px = W/2;
    for (let k = 0; k < PB; k++) {
      g.lineTo(px, Y(cum[k])); px = Xk(k, side); g.lineTo(px, Y(cum[k]));
    }
    g.lineTo(px, Y(0)); g.closePath();
    g.fillStyle = fill; g.fill(); g.strokeStyle = col; g.lineWidth = 2.5; g.stroke();
  }
  area(cb, -1, '#3fbf7f', 'rgba(63,191,127,.16)');
  area(ca, +1, '#e5484d', 'rgba(229,72,77,.16)');
  g.fillStyle = '#7c7c88'; g.font = '19px sans-serif'; g.textAlign = 'center';
  g.fillText(fmt(mid * (1 - R), 2), 60, H - 8);
  g.fillText(fmt(mid, 2), W/2, H - 8);
  g.fillText(fmt(mid * (1 + R), 2), W - 60, H - 8);
  g.fillStyle = '#d6d6dc'; g.font = '600 20px sans-serif';
  g.fillText('mid ' + fmt(mid, 3) + '   (window \u00B10.75%)', W/2, 24);
  g.fillStyle = '#7c7c88'; g.font = '17px sans-serif'; g.textAlign = 'left';
  g.fillText(cb[PB-1].toFixed(1) + ' BTC bid-side', 16, 26);
  g.textAlign = 'right';
  g.fillText(ca[PB-1].toFixed(1) + ' BTC ask-side', W - 16, 26);
}

function drawBook() {
  const f = F[i], D = 12;
  let rows = '<tr><th>Price</th><th>Amount</th><th>Total</th></tr>';
  if (f.a.length && f.b.length) {
    let cum = 0;
    const asks = f.a.slice(0, D).map(([p, s]) => [p, s, cum += s]);
    const amax = cum; cum = 0;
    const bids = f.b.slice(0, D).map(([p, s]) => [p, s, cum += s]);
    const bmax = cum;
    for (const [p, s, c] of asks.slice().reverse())
      rows += `<tr class="ask"><td><span>${fmt(p)}</span></td>` +
        `<td><span>${fmt(s)}</span></td>` +
        `<td><div class="bar" style="width:${(100*c/amax).toFixed(1)}%;` +
        `background:rgba(229,72,77,.14)"></div><span>${fmt(c,3)}</span></td></tr>`;
    const sp = f.a[0][0] - f.b[0][0], mid = (f.a[0][0] + f.b[0][0]) / 2;
    rows += `<tr class="spread"><td colspan="3"><b>${fmt(f.p)}</b>` +
      ` &nbsp; spread ${fmt(sp, 4)} (${(1e4 * sp / mid).toFixed(1)} bp)</td></tr>`;
    for (const [p, s, c] of bids)
      rows += `<tr class="bid"><td><span>${fmt(p)}</span></td>` +
        `<td><span>${fmt(s)}</span></td>` +
        `<td><div class="bar" style="width:${(100*c/bmax).toFixed(1)}%;` +
        `background:rgba(63,191,127,.14)"></div><span>${fmt(c,3)}</span></td></tr>`;
  }
  $('book').innerHTML = rows;
  const hist = [];
  for (let k = i; k >= 0 && hist.length < 11; k--)
    for (const [p, s] of F[k].x) { hist.push([F[k].t, p, s]); if (hist.length >= 11) break; }
  $('tl').innerHTML = hist.map(([t, p, s]) =>
    `<div><b>${fmt(p)}</b><span>${fmt(s)} BTC</span><span>t=${t}</span></div>`).join('');
}

function render() {
  $('scrub').value = i;
  const f = F[i];
  $('clock').textContent =
    `tick ${f.t} · ${clockStr(i + 0)} sim-clock · frame ${i+1}/${N}`;
  header(); drawPrice(); drawDepth(); drawBook();
}
function setTimer() {
  clearInterval(timer);
  if (playing) timer = setInterval(() => { i = Math.min(i + 1, N - 1); render();
    if (i === N - 1) { playing = false; $('play').textContent = 'Replay';
      clearInterval(timer); } }, 1000 / speed);
}
$('play').onclick = () => { if (i === N - 1) i = 0;
  playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play';
  setTimer(); render(); };
document.querySelectorAll('.sp').forEach(b => b.onclick = () => {
  speed = +b.dataset.sp;
  document.querySelectorAll('.sp').forEach(x => x.classList.toggle('on', x === b));
  setTimer(); });
$('hor').onchange = render;
$('scrub').oninput = e => { i = +e.target.value; render(); };
render(); setTimer();
</script>
